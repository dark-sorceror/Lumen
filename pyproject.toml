[project]
name = "lumen"
version = "0.1.0"
description = "Lumen: a white-box LLM workbench with controllable local inference on MLX"
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pymupdf>=1.28.0",
    "ocrmac>=1.0.1",
    "python-multipart>=0.0.32",
    "mlx-vlm>=0.6.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27", "hypothesis>=6"]

[tool.pytest.ini_options]
markers = ["slow: loads a real model; excluded by default run"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbench"]
